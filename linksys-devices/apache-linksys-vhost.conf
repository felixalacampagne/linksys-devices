<VirtualHost *:80>
    ServerName hostname.example
    ServerAlias hostname

    # Serve the Angular build under the /linksys path prefix.
    Alias "/linksys/" "/var/www/linksys-devices/dist/linksys-devices/browser/"

    <Directory "/var/www/linksys-devices/dist/linksys-devices/browser/">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /linksys/index.html [L]
    </Directory>

    # Normalize /linksys -> /linksys/
    RedirectMatch 301 ^/linksys$ /linksys/

    # Reverse-proxy only the JNAP endpoint to the router.
    # An optional include file can be placed directly in the web app root.
    # If it is missing or invalid, Apache falls back to 192.168.1.1 below.
    IncludeOptional "/var/www/linksys-devices/router-ip.conf"

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass "/linksys/JNAP/" "http://192.168.1.1/JNAP/"
    ProxyPassReverse "/linksys/JNAP/" "http://192.168.1.1/JNAP/"

    ProxyPass "/linksys/JNAP" "http://192.168.1.1/JNAP/"
    ProxyPassReverse "/linksys/JNAP" "http://192.168.1.1/JNAP/"
</VirtualHost>
