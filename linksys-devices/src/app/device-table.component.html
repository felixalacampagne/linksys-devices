<main class="page-shell">
  <mat-card>
    <mat-toolbar color="primary">Linksys Router Device List</mat-toolbar>

    <div class="form-row">
      <button
        mat-flat-button
        color="primary"
        class="fetch-button"
        (click)="loadDevices()"
        [disabled]="loading()"
      >
        Fetch Devices
      </button>
    </div>

    <div class="status-row" *ngIf="loading()">
      <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
      <span>Loading devices…</span>
    </div>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <div class="table-container" *ngIf="devices().length > 0">
      <table mat-table [dataSource]="devices()" class="mat-elevation-z4">
        <ng-container matColumnDef="macAddress">
          <th mat-header-cell *matHeaderCellDef>MAC Address</th>
          <td mat-cell *matCellDef="let device">{{ device.macAddress }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Device Name</th>
          <td mat-cell *matCellDef="let device">{{ device.name }}</td>
        </ng-container>

        <ng-container matColumnDef="ipAddress">
          <th mat-header-cell *matHeaderCellDef>IP Address</th>
          <td
            mat-cell
            *matCellDef="let device"
            [class.reserved-ip-bold]="device.reserved === 'Y'"
            [class.offline-reserved-ip]="device.reserved === 'Y'"
          >
            {{ device.ipAddress }}
          </td>
        </ng-container>


        <ng-container matColumnDef="comment">
          <th mat-header-cell *matHeaderCellDef>Comment</th>
          <td mat-cell *matCellDef="let device">{{ device.comment }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          [class.offline-row]="row.isOffline"
        ></tr>
      </table>
    </div>
  </mat-card>
</main>
